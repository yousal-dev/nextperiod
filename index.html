<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NextPeriod - Bell Schedule</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="noise"></div>
    <div class="container">
        <header>
            <div class="logo">
                <img src="logo.svg" alt="NextPeriod Logo" class="logo-img">
                <h1>NextPeriod</h1>
            </div>
            <p class="tagline">Smart Bell Schedule Countdown</p>
            <p class="dev-credit">by yousal.dev</p>
        </header>

        <div class="day-selector">
            <button class="day-btn active" data-day="regular">Regular Day</button>
            <button class="day-btn" data-day="wednesday">Wednesday</button>
        </div>

        <div class="current-info">
            <div class="current-period" id="currentPeriod">Loading...</div>
            <div class="timer" id="timer">--:--:--</div>
            <div class="progress-bar">
                <div class="progress" id="progress"></div>
            </div>
            <div id="status" class="status-text">Finding current period...</div>
        </div>

        <table class="schedule-table">
            <thead>
                <tr>
                    <th>Period</th>
                    <th>Time</th>
                    <th>Duration</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="scheduleBody"></tbody>
        </table>

        <footer>
            NextPeriod &copy; — Auto-updates every second.
            <a href="https://github.com/yousal-dev/nextperiod" class="footer-link">Github: yousal-dev</a>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
